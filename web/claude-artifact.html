<title>Soojeong Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
/* 한 열짜리 조용한 정원 노트: 위에서 아래로 한 가지 일에만 */
:root {
  --bg: #f4f6f1;
  --card: #ffffff;
  --text: #1f2620;
  --muted: #6b7568;
  --line: #dfe5da;
  --accent: #2f6f4e;
  --accent-soft: #e1eee5;
  --on-accent: #ffffff;
  --ink: #1f2620;
  --paper: #f4f6f1;
  --display: "Gowun Batang", "Apple SD Gothic Neo", "Noto Serif KR", serif;
  --body: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a16; --card: #1d241f; --text: #e8ece5; --muted: #98a393; --line: #2f3a31;
    --accent: #7fc29b; --accent-soft: #23362a; --on-accent: #0f1a13; --ink: #e8ece5; --paper: #151a16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a16; --card: #1d241f; --text: #e8ece5; --muted: #98a393; --line: #2f3a31;
  --accent: #7fc29b; --accent-soft: #23362a; --on-accent: #0f1a13; --ink: #e8ece5; --paper: #151a16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 var(--body);
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }
a { color: var(--accent); }
h1 { font-size: 1.5rem; margin: 0 0 12px; }
h3 { margin: 0 0 8px; font-size: 1rem; }

nav { display: flex; gap: 4px; justify-content: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
nav a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
/* 집중 중에는 다른 공간으로 가는 길을 숨긴다 */
body.focusing nav { visibility: hidden; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
.card label { display: block; margin: 10px 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.hero { padding: 24px 0 8px; }
.hero input { flex: 1; min-width: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid .card { margin: 0; }
.space { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
.space.soon { opacity: .55; }
.eyebrow { margin: 0 0 4px; color: var(--accent); font-size: .85rem; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.route { border-color: var(--accent); }

input, textarea, select {
  width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: inherit;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
.row input, .row select { width: auto; margin-top: 0; }
.hero .row input { flex: 1; }
button {
  font: inherit; padding: 9px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.small { padding: 2px 8px; font-size: .85rem; }
button.big { width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 8px; }

fieldset { border: 0; padding: 0; margin: 10px 0; }
legend { margin-bottom: 6px; }
.scale, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scale legend, .chips legend { width: 100%; }
.scale label, .chips label { margin: 0; }
.scale input, .chips input { position: absolute; opacity: 0; width: 1px; }
.scale span, .chips span {
  display: inline-block; min-width: 44px; text-align: center; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.chips span { border-radius: 999px; padding: 5px 12px; }
.scale input:checked + span, .chips input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.scale input:focus-visible + span, .chips input:focus-visible + span { outline: 2px solid var(--accent); }

.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.tag { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.draft { margin: 0 0 8px; padding-left: 18px; }

.ctx { margin-top: 6px; font-size: .85rem; color: var(--muted); }
.ctx summary { cursor: pointer; }
.ctx ul { margin: 4px 0 0; padding-left: 18px; }

.focus-run { text-align: center; padding-top: 12vh; }
.focus-run .step { font-size: 1.7rem; }
.timer { font-size: 4rem; font-weight: 300; font-variant-numeric: tabular-nums; margin: 16px 0 24px; }
.timer.over { color: var(--accent); }
.capture { display: flex; gap: 8px; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(608px, calc(100% - 32px)); }
.capture input { margin: 0; flex: 1; }

#toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: .9rem;
  max-width: calc(100% - 32px);
}
label .row input { flex: 1; min-width: 0; margin-top: 4px; }
label .row button { margin-top: 4px; white-space: nowrap; }

h1, .step { font-family: var(--display); font-weight: 700; text-wrap: balance; }
.save-note { text-align: center; font-size: .8rem; color: var(--muted); padding: 0 16px 24px; }
body.focusing .save-note { display: none; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
</style>
<nav>
  <a href="#home" data-view="home">입구</a>
  <a href="#energy" data-view="energy">에너지</a>
  <a href="#focus" data-view="focus">집중</a>
</nav>
<main id="app"></main>
<p class="save-note" id="save-note">이 브라우저에만 저장돼요</p>
<div id="toast" role="status" hidden></div>
<script>
// 순수 규칙 모음: 요청 연결(라우팅), 에너지 기반 제안, 공간별 공유 정보.
// UI·저장소와 분리해 두어 테스트하고 직접 고치기 쉽게 한다.

const SPACES = {
  energy: { label: '에너지 돌아보기', purpose: '지금 상태 기록', ready: true },
  focus: { label: '집중해서 일하기', purpose: '중요한 일 하나 시작', ready: true },
  study: { label: '학습', purpose: '오늘 연습 시작', ready: false },
  life: { label: '생활 비서', purpose: '생각난 일 맡겨두기', ready: false },
};

// 내 분류 방식에 맞게 직접 고치는 연결 규칙. 먼저 맞는 규칙이 이긴다.
const ROUTES = [
  { space: 'study', keywords: ['영어', '공부', '단어', '회화', '명상 공부', '내면소통', '미토콘드리아', '복습'] },
  { space: 'energy', keywords: ['피곤', '지쳐', '에너지', '기분', '감정', '회고', '명상', '운동', '루틴', '잠', '수면', '일기'] },
  { space: 'focus', keywords: ['업무', '일 시작', '일해야', '집중', '제안서', '작업', '마감', '회의 준비', '개발', '만들기'] },
  { space: 'life', keywords: ['쇼핑', '구매', '사야', '장보기', '여행', '숙소', '브랜드', '신상', '피부', '화장품', '예약'] },
];

function routeIntent(text) {
  const t = (text || '').trim();
  if (!t) return null;
  for (const r of ROUTES) {
    const hit = r.keywords.find((k) => t.includes(k));
    if (hit) return { space: r.space, matched: hit };
  }
  return { space: 'life', matched: null }; // 모르면 생활 비서 보관함으로
}

// 에너지가 낮아도 '쉬운 일'로 바꾸지 않는다. 같은 중요한 일의 시작 단위와 시간만 줄인다.
function suggestFocus(energy) {
  if (energy == null) return { minutes: 15, hint: '시작 행동을 한 문장으로 적어보세요.' };
  if (energy <= 2) return { minutes: 10, hint: '같은 일을 10분 안에 끝낼 크기로 줄여보세요. 예: 핵심 문장 세 개 쓰기' };
  if (energy === 3) return { minutes: 15, hint: '첫 15분에 끝낼 한 덩어리를 정해보세요.' };
  return { minutes: 25, hint: '가장 어려운 부분부터 시작해보세요.' };
}

// 공간마다 필요한 만큼만 공유한다. 감정·명상 원문은 에너지 공간 밖으로 나가지 않는다.
function sharedContext(space, { checkin, focusTask } = {}) {
  const items = [];
  if (checkin && space !== 'energy') {
    items.push({ source: '에너지 기록', text: `오늘 에너지 ${checkin.energy}/5` });
    if (checkin.energy <= 2 && space !== 'life') items.push({ source: '에너지 기록', text: '오늘은 부담을 낮추고 싶음' });
  }
  if (focusTask && space === 'energy') {
    items.push({ source: '집중 공간', text: `오늘 중요한 일: ${focusTask}` });
  }
  return items;
}

function localDate(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// 저녁 회고 초안: 하루 기록을 모아 보여주고, 사용자는 빠진 맥락만 더한다.
function reflectionDraft({ checkins = [], sessions = [], parked = [] }) {
  const lines = [];
  if (checkins.length) {
    const es = checkins.map((c) => c.energy);
    lines.push(`에너지 체크인 ${checkins.length}번 (${es.join(' → ')})`);
    const factors = [...new Set(checkins.flatMap((c) => c.factors || []))];
    if (factors.length) lines.push(`영향 요인: ${factors.join(', ')}`);
  }
  for (const s of sessions) {
    const delta = s.energyAfter != null && s.energyBefore != null ? s.energyAfter - s.energyBefore : null;
    const d = delta == null ? '' : delta > 0 ? ` · 에너지 +${delta}` : delta < 0 ? ` · 에너지 ${delta}` : ' · 에너지 그대로';
    lines.push(`집중 ${s.minutes}분: ${s.task} — ${s.done ? '해냄' : '진행 중'}${d}`);
  }
  if (parked.length) lines.push(`맡겨둔 생각 ${parked.length}개`);
  return lines;
}

// ---------- 저장: claude.ai 계정(db)에 저장, 안 되면 이 브라우저에만 ----------
const LS = 'soojeong-garden:v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const emptyState = () => ({
  profile: { principles: ['에너지가 낮으면 쉬운 일이 아니라, 중요한 일을 작게 시작한다.'] },
  checkins: [], sessions: [], parked: [], reflections: {}, activeSession: null,
});
function loadLocal() {
  try { const raw = localStorage.getItem(LS); return raw ? { ...emptyState(), ...JSON.parse(raw) } : emptyState(); }
  catch { return emptyState(); }
}
let cloud = null; // { stateDoc, dayDoc, day }
let saveWhere = 'local';
function save(s) {
  try { localStorage.setItem(LS, JSON.stringify(s)); } catch { /* 저장 불가 환경 */ }
  if (!cloud) return;
  const d = localDate();
  if (cloud.day !== d) { cloud.day = d; cloud.dayDoc = cloud.col.doc('day-' + d); }
  const onErr = () => { saveWhere = 'error'; updateSaveNote(); };
  cloud.stateDoc.set({ parked: s.parked, activeSession: s.activeSession, profile: s.profile }).catch(onErr);
  cloud.dayDoc.set({
    date: d,
    checkins: s.checkins.filter((x) => x.date === d),
    sessions: s.sessions.filter((x) => x.date === d),
    reflection: s.reflections[d] || '',
  }).catch(onErr);
}

// ---------- AI: 내 Claude 계정으로 묻기 (처음 한 번 허락) ----------
let sampleFn = null;
let aiBlocked = false;
const aiStatus = () => (sampleFn && !aiBlocked
  ? { enabled: true, label: '내 Claude 계정 · 처음 쓸 때 한 번 허락을 물어요' }
  : { enabled: false, label: aiBlocked ? '허락하지 않아 꺼져 있어요' : '연결 안 됨' });

const spaceList = Object.entries(SPACES).map(([k, v]) => `- ${k}: ${v.label} (${v.purpose})`).join('\n');
const AI_TASKS = {
  route: {
    prompt: ({ text }) => `개인용 도구의 입구에서 요청을 목적 공간으로 분류해. 요청을 실행하지 말고 분류만 해.
공간 목록:
${spaceList}
- 피곤·기분·감정·명상 기록·운동·루틴·회고 → energy
- 업무·중요한 일 시작·집중 → focus
- 영어·내면소통·미토콘드리아 등 공부 → study
- 쇼핑·여행·브랜드·피부 등 생활 잡무 → life
JSON만 답해: {"space":"<key>","reason":"<15자 이내 한국어>"}

요청: ${String(text).slice(0, 500)}`,
    parse: (o) => (SPACES[o?.space] ? { space: o.space, reason: String(o.reason || '').slice(0, 40) } : null),
  },
  firstStep: {
    prompt: ({ task, energy, minutes }) => `적은 에너지로도 중요한 일을 시작하게 도와줘.
규칙: 일을 더 쉬운 '다른 일'로 바꾸지 말고, 같은 일의 첫 행동을 주어진 시간 안에 끝낼 크기로 줄인다.
구체적인 동사로 끝나는 한국어 한 문장, 30자 이내.
JSON만 답해: {"step":"<첫 행동>"}

중요한 일: ${String(task).slice(0, 200)}
지금 에너지: ${energy ?? '모름'}/5
시간: ${Number(minutes) || 15}분`,
    parse: (o) => (typeof o?.step === 'string' && o.step.trim() ? { step: o.step.trim().slice(0, 80) } : null),
  },
};
async function ask(task, input) {
  if (!aiStatus().enabled) return null;
  const t = AI_TASKS[task];
  try {
    return t.parse(await sampleFn.json(t.prompt(input), { modelTier: 'quick' }));
  } catch (e) {
    if (e?.code === 'not_granted') { aiBlocked = true; render(); }
    return null;
  }
}

function updateSaveNote() {
  const el = document.getElementById('save-note');
  if (!el) return;
  el.textContent = saveWhere === 'cloud' ? '내 claude.ai 계정에 저장돼요 · 다른 기기에서도 이어져요'
    : saveWhere === 'error' ? '저장하지 못했어요. 잠시 후 다시 기록해 보세요.'
    : '이 브라우저에만 저장돼요';
}

async function boot() {
  if (!window.claude?.use) return;
  const use = (name) => window.claude.use(name);
  use('sample').then((s) => { if (s) { sampleFn = s; render(); } });
  const [db, user] = await Promise.all([use('db'), use('user')]);
  if (!db || !user) return;
  try {
    const id = await user.id();
    if (!id) return;
    const col = db.collection('data/users/' + id);
    const d = localDate();
    cloud = { col, stateDoc: col.doc('state'), dayDoc: col.doc('day-' + d), day: d };
    const [st, day] = await Promise.all([cloud.stateDoc.get(), cloud.dayDoc.get()]);
    if (st.exists || day.exists) {
      const a = st.data() || {}; const b = day.data() || {};
      state = {
        ...state,
        parked: a.parked || [], activeSession: a.activeSession || null, profile: a.profile || state.profile,
        checkins: b.checkins || [], sessions: b.sessions || [],
        reflections: { ...state.reflections, [d]: b.reflection || '' },
      };
    } else if (state.checkins.length || state.parked.length || state.sessions.length) {
      save(state); // 이 브라우저에 있던 기록을 계정으로 옮기기
    }
    saveWhere = 'cloud';
    render();
  } catch {
    cloud = null;
  }
}

let state = loadLocal();
const $app = document.getElementById('app');
const FACTORS = ['수면', '운동', '명상', '식사', '회의', '사람', '이동', '햇빛', '카페인'];

const commit = () => { save(state); render(); };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => localDate();
const todays = (list) => list.filter((x) => x.date === today());
const latestCheckin = () => todays(state.checkins).at(-1) || null;
const todayTask = () => todays(state.sessions).at(-1)?.task || state.activeSession?.task || null;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, 3000);
}

function park(text, from) {
  const r = routeIntent(text);
  state.parked.push({ id: uid(), date: today(), text, space: r.space, from, done: false });
  save(state);
  return r.space;
}

function contextNote(space) {
  const items = sharedContext(space, { checkin: latestCheckin(), focusTask: todayTask() });
  if (!items.length) return '';
  return `<details class="ctx"><summary>${esc(items[0].source)}에서 가져왔어요</summary>
    <ul>${items.map((i) => `<li>${esc(i.text)} <span class="muted">· ${esc(i.source)}</span></li>`).join('')}</ul></details>`;
}

// ---------- 입구 ----------
let pendingRoute = null;

function routeBasis(r) {
  if (r.reason === '직접 선택') return '직접 선택';
  if (r.reason) return `AI 판단: ${esc(r.reason)}`;
  const kw = r.matched ? `‘${esc(r.matched)}’로 판단` : '규칙으로 판단';
  return r.checking ? `${kw} · AI 확인 중…` : kw;
}

function viewHome() {
  const c = latestCheckin();
  const open = state.parked.filter((p) => !p.done);
  const route = pendingRoute && (() => {
    const s = SPACES[pendingRoute.space];
    const items = sharedContext(pendingRoute.space, { checkin: c, focusTask: todayTask() });
    return `<section class="card route">
      <p class="eyebrow">연결 제안</p>
      <h3>${esc(s.label)}${s.ready ? ' 공간으로 연결할게요' : '에게 맡겨둘까요?'}</h3>
      <p class="muted">“${esc(pendingRoute.text)}” · ${routeBasis(pendingRoute)}</p>
      ${items.length ? `<p class="small">전달할 정보: ${items.map((i) => esc(i.text)).join(', ')}</p>` : ''}
      <div class="row">
        ${s.ready ? `<button class="primary" data-act="go" data-space="${pendingRoute.space}">${esc(s.purpose)}</button>` : ''}
        <button data-act="park-route">보관하기</button>
        <select data-act="reroute" aria-label="다른 공간 선택">
          <option value="">다른 공간으로…</option>
          ${Object.entries(SPACES).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}
        </select>
        <button class="ghost" data-act="cancel-route">취소</button>
      </div></section>`;
  })();

  return `
    <section class="hero">
      <h1>지금 뭐 하고 싶으세요?</h1>
      <form data-form="intent" class="row">
        <input name="text" placeholder="예: 일 시작해야 하는데 너무 피곤해" autocomplete="off" required />
        <button class="primary">연결</button>
      </form>
      <p class="small muted">AI: ${esc(aiStatus().label)}${aiStatus().enabled ? '' : ' · 키워드 규칙으로 연결해요'}</p>
    </section>
    ${route || ''}
    <section class="grid">
      ${Object.entries(SPACES).map(([k, s]) => `
        <a class="card space ${s.ready ? '' : 'soon'}" ${s.ready ? `href="#${k}"` : ''}>
          <strong>${esc(s.label)}</strong><span class="muted">${esc(s.purpose)}${s.ready ? '' : ' · 준비 중'}</span>
        </a>`).join('')}
    </section>
    <section class="card">
      <h3>오늘</h3>
      <p>${c ? `에너지 ${c.energy}/5${c.mood ? ` · ${esc(c.mood)}` : ''}` : '<span class="muted">아직 체크인 전이에요.</span> <a href="#energy">기록하기</a>'}</p>
      ${todayTask() ? `<p>중요한 일: ${esc(todayTask())}</p>` : ''}
    </section>
    <section class="card">
      <h3>맡겨둔 생각 <span class="muted">${open.length}</span></h3>
      ${open.length ? `<ul class="list">${open.map((p) => `
        <li><span class="tag">${esc(SPACES[p.space]?.label || p.space)}</span> ${esc(p.text)}
          <button class="ghost small" data-act="done-parked" data-id="${p.id}">처리함</button></li>`).join('')}</ul>`
        : '<p class="muted">비어 있어요. 집중 중에 떠오른 생각이 여기 쌓여요.</p>'}
    </section>`;
}

// ---------- 에너지 돌아보기 ----------
function viewEnergy() {
  const cs = todays(state.checkins);
  const ss = todays(state.sessions);
  const draft = reflectionDraft({ checkins: cs, sessions: ss, parked: todays(state.parked) });
  const saved = state.reflections[today()] || '';
  return `
    <header class="space-head"><p class="eyebrow">에너지 돌아보기</p><h1>지금 상태 기록</h1>${contextNote('energy')}</header>
    <form data-form="checkin" class="card">
      <fieldset class="scale"><legend>에너지</legend>
        ${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="energy" value="${n}" required /><span>${n}</span></label>`).join('')}
      </fieldset>
      <label>기분 한 단어 <input name="mood" placeholder="예: 멍함, 차분" autocomplete="off" /></label>
      <fieldset class="chips"><legend>영향을 준 것</legend>
        ${FACTORS.map((f) => `<label><input type="checkbox" name="factors" value="${f}" /><span>${f}</span></label>`).join('')}
      </fieldset>
      <label>메모 <span class="muted small">(이 공간에만 저장돼요)</span><textarea name="note" rows="2"></textarea></label>
      <button class="primary">기록</button>
    </form>
    <section class="card">
      <h3>오늘의 흐름</h3>
      ${cs.length || ss.length ? `<ul class="list">
        ${[...cs.map((c) => ({ at: c.at, t: `에너지 ${c.energy}/5${c.mood ? ` · ${esc(c.mood)}` : ''}${c.factors?.length ? ` · ${c.factors.map(esc).join(', ')}` : ''}${c.note ? `<br><span class="muted">${esc(c.note)}</span>` : ''}` })),
          ...ss.map((s) => ({ at: s.at, t: `집중 ${s.minutes}분 · ${esc(s.task)}${s.energyAfter ? ` · 끝나고 ${s.energyAfter}/5` : ''}${s.note ? `<br><span class="muted">${esc(s.note)}</span>` : ''}` }))]
          .sort((a, b) => a.at - b.at)
          .map((x) => `<li><span class="time">${new Date(x.at).toTimeString().slice(0, 5)}</span> ${x.t}</li>`).join('')}
      </ul>` : '<p class="muted">아직 기록이 없어요.</p>'}
    </section>
    <form data-form="reflection" class="card">
      <h3>하루 회고</h3>
      ${draft.length ? `<ul class="draft">${draft.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : '<p class="muted">기록이 쌓이면 초안이 만들어져요.</p>'}
      <label>빠진 맥락 한 줄<textarea name="text" rows="2" placeholder="오늘 에너지를 가장 많이 쓴/채운 건?">${esc(saved)}</textarea></label>
      <button>회고 저장</button>
    </form>`;
}

// ---------- 집중해서 일하기 ----------
let focusStage = null; // null(선택) | 'review'

function viewFocus() {
  const a = state.activeSession;
  if (a && focusStage !== 'review') return focusRunning(a);
  if (a && focusStage === 'review') return focusReview(a);
  const c = latestCheckin();
  const sug = suggestFocus(c?.energy);
  return `
    <header class="space-head"><p class="eyebrow">집중해서 일하기</p><h1>중요한 일 하나 시작</h1>
      ${c ? contextNote('focus') : '<p class="small muted">에너지 체크인이 없어 기본값을 써요. <a href="#energy">체크인</a></p>'}
    </header>
    <form data-form="focus-start" class="card">
      <label>오늘 가장 중요한 일<input name="task" required autocomplete="off" value="${esc(todayTask() || '')}" placeholder="예: 제안서 작성" /></label>
      <label>첫 행동 <span class="muted small">${esc(sug.hint)}</span>
        <span class="row"><input name="step" required autocomplete="off" placeholder="예: 핵심 문장 세 개 쓰기" />
        ${aiStatus().enabled ? '<button type="button" data-act="ai-step">AI로 줄이기</button>' : ''}</span></label>
      <fieldset class="scale"><legend>시간</legend>
        ${[10, 15, 25].map((m) => `<label><input type="radio" name="minutes" value="${m}" ${m === sug.minutes ? 'checked' : ''} /><span>${m}분</span></label>`).join('')}
      </fieldset>
      <button class="primary big">시작</button>
    </form>`;
}

function remaining(a) {
  return Math.max(0, a.startedAt + a.minutes * 60000 - Date.now());
}
const mmss = (ms) => { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

function focusRunning(a) {
  return `
    <section class="focus-run">
      <p class="eyebrow">${esc(a.task)}</p>
      <h1 class="step">${esc(a.step)}</h1>
      <div class="timer" id="timer">${mmss(remaining(a))}</div>
      <div class="row center"><button class="primary" data-act="focus-end">끝내기</button></div>
      <form data-form="capture" class="capture">
        <input name="text" placeholder="떠오른 생각은 여기 맡겨두기" autocomplete="off" required />
        <button>맡겨두기</button>
      </form>
    </section>`;
}

function focusReview(a) {
  return `
    <header class="space-head"><p class="eyebrow">집중 끝</p><h1>${esc(a.step)}</h1></header>
    <form data-form="focus-review" class="card">
      <fieldset class="scale"><legend>첫 행동, 해냈나요?</legend>
        <label><input type="radio" name="done" value="1" required /><span>해냈어요</span></label>
        <label><input type="radio" name="done" value="0" /><span>아직</span></label>
      </fieldset>
      <fieldset class="scale"><legend>지금 에너지 <span class="muted small">시작 전 ${a.energyBefore ?? '–'}/5</span></legend>
        ${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="energyAfter" value="${n}" required /><span>${n}</span></label>`).join('')}
      </fieldset>
      <label>한 줄 회고<input name="note" autocomplete="off" placeholder="예: 시작하니 생각보다 괜찮았음" /></label>
      <button class="primary">저장</button>
    </form>`;
}

// ---------- 렌더 & 이벤트 ----------
function currentView() {
  const r = location.hash.replace('#', '') || 'home';
  return ['home', 'energy', 'focus'].includes(r) ? r : 'home';
}

function render() {
  const v = currentView();
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.view === v));
  document.body.dataset.view = v;
  document.body.classList.toggle('focusing', v === 'focus' && !!state.activeSession && focusStage !== 'review');
  $app.innerHTML = { home: viewHome, energy: viewEnergy, focus: viewFocus }[v]();
  updateSaveNote();
}

$app.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const fd = new FormData(f);
  switch (f.dataset.form) {
    case 'intent': {
      const text = fd.get('text').trim();
      const ai = aiStatus().enabled;
      pendingRoute = { text, ...routeIntent(text), checking: ai };
      render();
      if (ai) {
        ask('route', { text }).then((r) => {
          if (pendingRoute?.text !== text) return; // 그사이 다른 요청을 했으면 무시
          pendingRoute = r ? { text, space: r.space, reason: r.reason } : { ...pendingRoute, checking: false };
          if (currentView() === 'home') render();
        });
      }
      return;
    }
    case 'checkin':
      state.checkins.push({
        id: uid(), date: today(), at: Date.now(), energy: Number(fd.get('energy')),
        mood: fd.get('mood').trim(), factors: fd.getAll('factors'), note: fd.get('note').trim(),
      });
      toast('기록했어요.');
      return commit();
    case 'reflection':
      state.reflections[today()] = fd.get('text').trim();
      toast('회고를 저장했어요.');
      return commit();
    case 'focus-start':
      state.activeSession = {
        id: uid(), task: fd.get('task').trim(), step: fd.get('step').trim(),
        minutes: Number(fd.get('minutes')), startedAt: Date.now(), energyBefore: latestCheckin()?.energy ?? null,
      };
      focusStage = null;
      return commit();
    case 'capture': {
      const text = fd.get('text').trim();
      const sp = park(text, 'focus');
      f.reset();
      return toast(`${SPACES[sp].label} 보관함에 맡겨뒀어요. 하던 일을 이어가세요.`);
    }
    case 'focus-review': {
      const a = state.activeSession;
      state.sessions.push({
        ...a, date: today(), at: a.startedAt, done: fd.get('done') === '1',
        energyAfter: Number(fd.get('energyAfter')), note: fd.get('note').trim(),
        actualMinutes: Math.round((Math.min(Date.now(), a.startedAt + a.minutes * 60000) - a.startedAt) / 60000),
      });
      state.activeSession = null;
      focusStage = null;
      toast('저장했어요. 에너지 기록에도 남았어요.');
      return commit();
    }
  }
});

$app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  switch (b.dataset.act) {
    case 'go':
      pendingRoute = null;
      location.hash = `#${b.dataset.space}`;
      return;
    case 'park-route':
      state.parked.push({ id: uid(), date: today(), text: pendingRoute.text, space: pendingRoute.space, from: 'home', done: false });
      toast(`${SPACES[pendingRoute.space].label} 보관함에 맡겨뒀어요.`);
      pendingRoute = null;
      return commit();
    case 'cancel-route':
      pendingRoute = null;
      return render();
    case 'done-parked': {
      const p = state.parked.find((x) => x.id === b.dataset.id);
      if (p) p.done = true;
      return commit();
    }
    case 'ai-step': {
      const form = b.closest('form');
      const task = form.task.value.trim();
      if (!task) { form.task.focus(); return toast('중요한 일을 먼저 적어주세요.'); }
      b.disabled = true;
      b.textContent = '생각 중…';
      ask('firstStep', { task, energy: latestCheckin()?.energy ?? null, minutes: Number(new FormData(form).get('minutes')) })
        .then((r) => {
          b.disabled = false;
          b.textContent = 'AI로 줄이기';
          if (r) { form.step.value = r.step; form.step.focus(); } else toast('AI 제안을 받지 못했어요. 직접 적어주세요.');
        });
      return;
    }
    case 'focus-end':
      focusStage = 'review';
      return render();
  }
});

$app.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'reroute' && e.target.value && pendingRoute) {
    pendingRoute = { text: pendingRoute.text, space: e.target.value, matched: null, reason: '직접 선택' };
    render();
  }
});

setInterval(() => {
  const el = document.getElementById('timer');
  const a = state.activeSession;
  if (!el || !a) return;
  const r = remaining(a);
  el.textContent = mmss(r);
  if (r === 0 && !el.dataset.rang) {
    el.dataset.rang = '1';
    el.classList.add('over');
    document.title = '⏰ 끝 · Soojeong Garden';
  }
}, 1000);

window.addEventListener('hashchange', () => { pendingRoute = null; render(); });
render();
boot();

</script>
