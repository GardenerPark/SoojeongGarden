# iOS 앱이 빌드되고 테스트가 통과하는지 Mac 빌드 서버에서 확인한다. 서명 없이 시뮬레이터용으로만 빌드한다.
name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Xcode 프로젝트 만들기
        run: |
          brew install xcodegen
          xcodegen

      - name: 빌드와 테스트
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9][^(]*' | head -1 | sed 's/ *$//')"
          echo "destination: $DEST"
          set -o pipefail
          xcodebuild test \
            -project SignalNoise.xcodeproj \
            -scheme SignalNoise \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: 실패하면 오류만 모아 보기
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50 || true
