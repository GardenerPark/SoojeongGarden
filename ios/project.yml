# XcodeGen 설정. Mac에서 `brew install xcodegen && xcodegen`을 실행하면 SignalNoise.xcodeproj가 생긴다.
# 출시 전에 DEVELOPMENT_TEAM을 내 Apple 개발자 팀 ID로 바꾸고,
# 번들 ID(com.soojeonggarden.*)와 앱 그룹(group.com.soojeonggarden.signalnoise)을 내 것으로 바꾼다.
name: SignalNoise
options:
  bundleIdPrefix: com.soojeonggarden
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SignalNoise:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    resources:
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 하나
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 떠오른 생각을 말로 적을 때 마이크를 써요.
        NSSpeechRecognitionUsageDescription: 말한 내용을 글자로 바꿔 입력창에 넣어요. 가능하면 기기 안에서만 인식해요.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/SignalNoise.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soojeonggarden.signalnoise]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soojeonggarden.signalnoise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 하나
    dependencies:
      - target: SignalNoiseWidgets
  SignalNoiseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    resources:
      - Resources/PrivacyInfo.xcprivacy
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 하나
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: Widgets/SignalNoiseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soojeonggarden.signalnoise]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soojeonggarden.signalnoise.widgets
  SignalNoiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SignalNoise
schemes:
  SignalNoise:
    build:
      targets:
        SignalNoise: all
    test:
      targets:
        - SignalNoiseTests
